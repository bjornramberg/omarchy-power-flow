name: Verify collector binaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: >-
          Optional commit to compare the built source and binaries against,
          for example the marketplace snapshot commit.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Rebuild and attest
    runs-on: ubuntu-latest
    env:
      # The backend has no external dependencies, so the build must not need
      # the network.  GOEXPERIMENT, GOTOOLCHAIN and CGO_ENABLED are pinned by
      # scripts/build-env.sh.
      GOPROXY: 'off'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Assert the installed Go matches backend/go.mod
        run: |
          set -euo pipefail
          expected=$(awk '$1 == "toolchain" { print $2; exit }' backend/go.mod)
          actual=$(go env GOVERSION)
          printf 'backend/go.mod toolchain: %s\ninstalled Go: %s\n' "$expected" "$actual"
          if [ "$expected" != "$actual" ]; then
            echo "installed Go does not match backend/go.mod" >&2
            exit 1
          fi

      - name: Assert the built tree matches the baseline commit
        if: inputs.baseline_ref != ''
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ inputs.baseline_ref }}"
          git diff --stat "${{ inputs.baseline_ref }}" HEAD -- backend bin
          if ! git diff --quiet "${{ inputs.baseline_ref }}" HEAD -- backend bin; then
            echo "backend/ or bin/ differ from ${{ inputs.baseline_ref }}" >&2
            exit 1
          fi
          echo "backend/ and bin/ are identical to ${{ inputs.baseline_ref }}"

      - name: Build the collector binaries
        run: ./scripts/build-binaries.sh --out-dir "$RUNNER_TEMP/rebuilt"

      - name: Compare with the tracked binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            cmp "$RUNNER_TEMP/rebuilt/omarchy-power-flow-linux-$arch" \
                "bin/omarchy-power-flow-linux-$arch"
            echo "bin/omarchy-power-flow-linux-$arch matches the rebuild"
          done
          sha256sum -c SHA256SUMS

      - name: Run the backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

      - name: Attest the collector binaries
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/rebuilt/omarchy-power-flow-linux-*

      - name: Upload the rebuilt collector binaries
        uses: actions/upload-artifact@v4
        with:
          name: collector-binaries
          path: ${{ runner.temp }}/rebuilt/omarchy-power-flow-linux-*
          if-no-files-found: error
