name: Verify collector binaries

# Rebuilds the shipped collector binaries from backend/ with the Go toolchain
# pinned in backend/go.mod and compares them byte-for-byte with the tracked
# files in bin/.  The rebuilt files are published as workflow artifacts and
# carry a GitHub build-provenance attestation, so anyone can check that the
# shipped binaries are the output of this source tree without trusting this
# repository's own hash file.
#
# The pinned upstream toolchain is selected with GOTOOLCHAIN rather than
# actions/setup-go, so the exact release recorded in backend/go.mod is used
# even when the runner ships a different Go build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rebuild and compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the pinned Go toolchain
        id: toolchain
        working-directory: backend
        run: |
          version="$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          if [[ -z "$version" ]]; then
            echo "backend/go.mod does not pin a toolchain" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "GOTOOLCHAIN=$version" >> "$GITHUB_ENV"

      - name: Confirm the pinned toolchain is in use
        run: |
          expected="${{ steps.toolchain.outputs.version }}"
          actual="$(go version | awk '{print $3}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "expected toolchain $expected, got $actual" >&2
            exit 1
          fi
          go version

      - name: Report tracked binary identities
        run: |
          for arch in amd64 arm64; do
            path="bin/omarchy-power-flow-linux-$arch"
            printf '%s\n' "$path"
            printf '  git blob: %s\n' "$(git rev-parse "HEAD:$path")"
            printf '  sha256:   %s\n' "$(sha256sum "$path" | cut -d' ' -f1)"
          done

      - name: Verify tracked binaries against clean builds
        run: ./scripts/verify-binaries.sh --output-dir "$RUNNER_TEMP/rebuilt"

      - name: Verify published hashes
        run: sha256sum -c SHA256SUMS

      - name: Upload rebuilt binaries
        uses: actions/upload-artifact@v4
        with:
          name: collector-binaries-amd64
          path: ${{ runner.temp }}/rebuilt/omarchy-power-flow-linux-amd64
          if-no-files-found: error
          retention-days: 90

      - name: Upload rebuilt binaries (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: collector-binaries-arm64
          path: ${{ runner.temp }}/rebuilt/omarchy-power-flow-linux-arm64
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance (amd64)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/rebuilt/omarchy-power-flow-linux-amd64

      - name: Attest build provenance (arm64)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/rebuilt/omarchy-power-flow-linux-arm64
